services:
  - type: web
    name: paras-ai-innovations
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    
    headers:
      # Default cache for HTML and non-asset files
      - path: /*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      
      # Long-term cache for assets (images, fonts, CSS, JS)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      
      # Disable caching for HTML pages
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    
    # No rewrite needed - Astro generates individual HTML files
    # Direct navigation to /, /work/, /contact/ will work automatically
